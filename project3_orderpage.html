<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Page</title>
    <link rel="stylesheet" href="project3_stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
<section class="order-page-container">
  <header>
    enhance
    <nav>
      <a href=""> shop all</a>
      <a href=""> my cart</a>
    </nav>
  </header>

  <section class="subhead">
    <h2>My Order</h2>
  </section>

  <section class="order-content">
    <div class="left-side-container">
      <div class="product-details">
        <img src="project3_images/red_pinwheel.jpg" alt="origami red pinwheel earrings">
        <div class="text-container">
          <div class="left">
            <h3>Origami Red Pinwheel Earring</h3>
            <h4>Quantity: 1</h4>
          </div>
          <div class="right">
            <h3>$15</h3>
          </div>
        </div>
      </div>
      <div class="product-details">
        <img src="project3_images/cluster_earring.jpg" alt="blue cluster bead earrings">
        <div class="text-container">
          <div class="left">
            <h3>Origami Blue Cluster Earring</h3>
            <h4>Quantity: 1</h4>
          </div>
          <div class="right">
            <h3>$15</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="right-side-container">
      <div class="details">
        <div class="left">
          <h3>Subtotal</h3>
          <h4>Estimated Shipping</h4>
          <h4>Estimated Tax</h4>
          <h3>Total</h3>
        </div>
        <div class="right">
          <h3>30</h3>
          <h4>7</h4>
          <h4>--</h4>
          <h3>37</h3>
        </div>
      </div>
    </div>
  </section>

  <section class="contact-subhead">
    <h2>Contact Information</h2>
  </section>

  <form>
    <input type="text" name="firstname" placeholder="First Name" required><br/>
    <input type="text" name="lastname" placeholder="Last Name" required><br/>
    <input type="number" name="phone" placeholder="Phone Number" required><br/>
    <input type="email" name="email" placeholder="Email" required><br/>
    <input type="text" name="address" placeholder="Address" required><br/>
    <input type="number" name="carddetails" placeholder="Card Number" required><br/>
    <input type="submit" value="Submit">
  </form>



  <footer>
    <p>Contact Us</p>
    <p>Social Media</p>
  </footer>



</body>
</html>
