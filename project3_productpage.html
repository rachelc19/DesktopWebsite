<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Individual Product Page</title>
    <link rel="stylesheet" href="project3_stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>

<section class="product-page-container">
    <header>
        <img src="project3_images/logotype.svg">

        <nav>
            <a href="project3_shop_all.html"> shop all</a>
            <a href="project3_orderpage.html"> my cart</a>
        </nav>

    </header>

    <section class="main-content">
        <div class="left">
            <img src="project3_images/red_pinwheel.jpg" alt="origami red pinwheel earring">
        </div>
        <div class="right">
            <div class="top-text">
                <h2>Origami Red Pinwheel Earring</h2>
                <h3>$15</h3>
                <h3>Product Details</h3>
                <h4>These pinwheel-shaped earrings are handmade with two sheets of origami paper each, one floral
                    and one plain. They're great for adding a pop of color to any outfit.
                    Dimensions: 1" x 1"</h4>
            </div>

            <div class="bottom-content">
                <a href=project3_orderpage.html class="button">Add to Bag</a>
                <div class="additional-images">
                    <img src="project3_images/progress_earring.jpeg" alt="earring making materials">
                    <img src="project3_images/wearing_earring.jpeg" alt="person wearing earring">
                    <img src="project3_images/hanging_earring.jpg" alt="hanging earrings">
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>Contact Us</p>
        <p>Social Media</p>
    </footer>

</section>

</html>
